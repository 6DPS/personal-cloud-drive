<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DP Logo Preview</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
        background: #edf5ff;
        color: #172033;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
        background:
          linear-gradient(120deg, rgba(221, 237, 255, 0.96), rgba(249, 252, 255, 0.78) 36%, rgba(229, 248, 243, 0.76)),
          #edf5ff;
      }

      .board {
        width: min(1040px, 100%);
        display: grid;
        grid-template-columns: 1fr 1.1fr;
        gap: 24px;
        padding: 26px;
        border: 1px solid rgba(255, 255, 255, 0.76);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.58);
        box-shadow: 0 28px 80px rgba(42, 67, 104, 0.16);
        backdrop-filter: blur(28px) saturate(1.25);
      }

      .hero,
      .panel {
        border: 1px solid rgba(255, 255, 255, 0.78);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.56);
        box-shadow: 0 18px 48px rgba(42, 67, 104, 0.12);
        backdrop-filter: blur(22px) saturate(1.18);
      }

      .hero {
        min-height: 520px;
        display: grid;
        place-items: center;
        padding: 30px;
      }

      .logo {
        position: relative;
        width: 268px;
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        border-radius: 34%;
        clip-path: inset(0 round 34%);
        overflow: hidden;
        background:
          radial-gradient(circle at 28% 22%, rgba(255, 255, 255, 0.95), transparent 0 18%, transparent 32%),
          linear-gradient(145deg, #0f7dff 0%, #0aaed2 48%, #00a982 100%);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.62),
          inset 0 -18px 38px rgba(0, 54, 107, 0.2),
          0 34px 76px rgba(12, 98, 190, 0.34);
      }

      .logo::before {
        content: "";
        position: absolute;
        inset: 13px;
        border-radius: 32%;
        clip-path: inset(0 round 32%);
        border: 1px solid rgba(255, 255, 255, 0.34);
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.38), transparent 42%),
          linear-gradient(315deg, rgba(255, 255, 255, 0.08), transparent 55%);
        pointer-events: none;
      }

      .logo .soft-rim {
        position: absolute;
        inset: 0;
        z-index: 1;
        border-radius: inherit;
        pointer-events: none;
        box-shadow:
          inset 18px 18px 38px rgba(255, 255, 255, 0.16),
          inset -18px -20px 42px rgba(0, 49, 104, 0.16);
      }

      .logo::after {
        content: "";
        position: absolute;
        left: -30%;
        top: -42%;
        width: 92%;
        height: 72%;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.2);
        transform: rotate(-22deg);
      }

      .mark {
        position: relative;
        z-index: 2;
        width: 164px;
        height: 142px;
      }

      .stroke {
        position: absolute;
        background: #fff;
        box-shadow: 0 8px 18px rgba(0, 67, 128, 0.18);
      }

      .spine {
        left: 0;
        top: 0;
        width: 34px;
        height: 142px;
        border-radius: 13px;
      }

      .d-top,
      .d-bottom {
        left: 0;
        width: 108px;
        height: 31px;
        border-radius: 13px 22px 22px 13px;
      }

      .d-top {
        top: 0;
        transform: skewX(-13deg);
        transform-origin: left top;
      }

      .d-bottom {
        bottom: 0;
        transform: skewX(13deg);
        transform-origin: left bottom;
      }

      .d-side {
        display: none;
      }

      .p-stem {
        left: 82px;
        top: 0;
        width: 34px;
        height: 142px;
        border-radius: 13px;
      }

      .p-top {
        left: 82px;
        top: 0;
        width: 82px;
        height: 31px;
        border-radius: 13px 24px 24px 13px;
        transform: skewX(-12deg);
        transform-origin: left top;
      }

      .p-mid {
        left: 82px;
        top: 57px;
        width: 76px;
        height: 30px;
        border-radius: 13px 22px 22px 13px;
      }

      .p-side {
        right: 0;
        top: 24px;
        width: 31px;
        height: 62px;
        border-radius: 18px;
        transform: skewY(10deg);
      }

      .cut {
        position: absolute;
        z-index: 3;
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: linear-gradient(145deg, #1090ed, #08a6c0);
        transform: rotate(45deg);
      }

      .cut.one {
        left: 48px;
        top: 56px;
      }

      .cut.two {
        left: 122px;
        top: 28px;
      }

      .info {
        display: grid;
        gap: 18px;
      }

      .panel {
        padding: 24px;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: 30px;
        letter-spacing: 0;
      }

      p {
        color: #5f6f87;
        line-height: 1.7;
      }

      .sizes {
        display: flex;
        align-items: center;
        gap: 18px;
        flex-wrap: wrap;
      }

      .sample {
        display: grid;
        justify-items: center;
        gap: 8px;
        color: #60728c;
        font-size: 13px;
      }

      .sample .logo {
        width: var(--size);
      }

      .sample .mark {
        width: calc(var(--size) * 0.61);
        height: calc(var(--size) * 0.53);
      }

      .sample .stroke {
        transform-origin: top left;
      }

      .sample .mark {
        transform: scale(calc(var(--size) / 268));
      }

      .dark {
        background: linear-gradient(135deg, #172033, #243653);
        color: #fff;
      }

      .dark p {
        color: rgba(255, 255, 255, 0.72);
      }

      @media (max-width: 820px) {
        .board {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="board">
      <section class="hero">
        <div class="logo" aria-label="DP logo">
          <span class="soft-rim"></span>
          <div class="mark">
            <span class="stroke spine"></span>
            <span class="stroke d-top"></span>
            <span class="stroke d-bottom"></span>
            <span class="stroke d-side"></span>
            <span class="stroke p-stem"></span>
            <span class="stroke p-top"></span>
            <span class="stroke p-mid"></span>
            <span class="stroke p-side"></span>
            <span class="cut one"></span>
            <span class="cut two"></span>
          </div>
        </div>
      </section>

      <section class="info">
        <div class="panel">
          <h1>几何共轴 DP 标识</h1>
          <p>
            蓝青玻璃底，外轮廓采用更柔和的连续曲率方形，D 的右边界和 P 的左主干共用一条中轴线。它比普通文字更像 App 标志，
            小尺寸也能保留识别度，适合放在左侧品牌、浏览器图标和未来移动端入口。
          </p>
        </div>

        <div class="panel">
          <div class="sizes">
            <div class="sample" style="--size: 96px">
              <div class="logo"><span class="soft-rim"></span><div class="mark"><span class="stroke spine"></span><span class="stroke d-top"></span><span class="stroke d-bottom"></span><span class="stroke d-side"></span><span class="stroke p-stem"></span><span class="stroke p-top"></span><span class="stroke p-mid"></span><span class="stroke p-side"></span><span class="cut one"></span><span class="cut two"></span></div></div>
              <span>侧栏</span>
            </div>
            <div class="sample" style="--size: 64px">
              <div class="logo"><span class="soft-rim"></span><div class="mark"><span class="stroke spine"></span><span class="stroke d-top"></span><span class="stroke d-bottom"></span><span class="stroke d-side"></span><span class="stroke p-stem"></span><span class="stroke p-top"></span><span class="stroke p-mid"></span><span class="stroke p-side"></span><span class="cut one"></span><span class="cut two"></span></div></div>
              <span>按钮</span>
            </div>
            <div class="sample" style="--size: 40px">
              <div class="logo"><span class="soft-rim"></span><div class="mark"><span class="stroke spine"></span><span class="stroke d-top"></span><span class="stroke d-bottom"></span><span class="stroke d-side"></span><span class="stroke p-stem"></span><span class="stroke p-top"></span><span class="stroke p-mid"></span><span class="stroke p-side"></span><span class="cut one"></span><span class="cut two"></span></div></div>
              <span>小图标</span>
            </div>
          </div>
        </div>

        <div class="panel dark">
          <h1>深色背景测试</h1>
          <p>白色几何字母在暗色背景上也清楚，后续换主题时不用重画。</p>
        </div>
      </section>
    </main>
  </body>
</html>
